<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar vuelos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <div class="container">
    <form id="busqueda-vuelos">
      <h2>Buscar Vuelos</h2>

      <div class="form-group">
        <label for="origen">Origen:</label>
        <input type="text" id="origen" name="origen" placeholder="Ciudad de origen" required>
      </div>

      <div class="form-group">
        <label for="destino">Destino:</label>
        <input type="text" id="destino" name="destino" placeholder="Ciudad de destino" required>
      </div>

      <div class="form-group">
        <label for="fecha">Fecha de viaje:</label>
        <input type="date" id="fecha" name="fecha" required>
      </div>

      <button type="submit" class="btn">Buscar vuelos</button>
    </form>
  </div>
</body>
</html>
